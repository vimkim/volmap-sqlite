[package]
name = "volmap-sqlite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Read-only explorer of SQLite physical storage"

[lib]
name = "volmap_sqlite"
path = "src/lib.rs"

[[bin]]
name = "volmap-sqlite"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
